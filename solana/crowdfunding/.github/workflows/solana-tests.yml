name: Solana Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force --locked
          avm install 0.31.1
          avm use 0.31.1

      - name: Install Node dependencies
        working-directory: solana/crowdfunding
        run: npm install

      - name: Generate Solana keypair
        run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json

      - name: Set cluster to devnet
        run: solana config set --url devnet

      - name: Run Anchor tests
        working-directory: solana/crowdfunding
        run: anchor test --skip-local-validator
